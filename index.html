<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Plataforma Edu</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 460px;
      padding: 32px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary-color);
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Seletor de Perfil */
    .role-selection-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: block;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .role-btn {
      background-color: var(--bg-color);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .role-btn:hover {
      border-color: #a5b4fc;
    }

    .role-btn.active {
      border-color: var(--primary-color);
      background-color: #e0e7ff;
      color: var(--primary-color);
    }

    .role-icon {
      font-size: 1.4rem;
    }

    .role-name {
      font-size: 0.8rem;
      font-weight: 700;
    }

    /* Formulário */
    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary-color);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.85rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .forgot-password {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      background-color: var(--primary-color);
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }

    /* Alerta de Mensagens */
    .alert-box {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }

    .alert-danger {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .alert-success {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    /* Dica de Demonstração */
    .demo-info {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-color);
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="login-container">
    <header class="brand-header">
      <div class="brand-logo">Plataforma Edu</div>
      <p class="brand-subtitle">Acesse sua conta para continuar</p>
    </header>

    <!-- Caixa de Feedback/Erros -->
    <div id="alert-message" class="alert-box"></div>

    <!-- Seleção de Tipo de Login -->
    <span class="role-selection-label">Selecione o seu perfil de acesso:</span>
    <div class="role-grid">
      <button type="button" class="role-btn active" data-role="aluno">
        <span class="role-icon">👨‍🎓</span>
        <span class="role-name">Aluno</span>
      </button>

      <button type="button" class="role-btn" data-role="professor">
        <span class="role-icon">👨‍🏫</span>
        <span class="role-name">Professor</span>
      </button>

      <button type="button" class="role-btn" data-role="gestor">
        <span class="role-icon">🏛️</span>
        <span class="role-name">Gestor</span>
      </button>
    </div>

    <!-- Formulário de Login -->
    <form id="login-form">
      <div class="form-group">
        <label for="email">E-mail corporativo / institucional</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="nome@escola.edu.br" 
            required 
            autocomplete="email"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
          <button type="button" id="toggle-password-btn" class="toggle-password" aria-label="Mostrar ou ocultar senha">
            👁️
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember-me">
          Lembrar-me neste dispositivo
        </label>
        <a href="#" id="forgot-password-link" class="forgot-password">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-login" id="submit-btn">Entrar na Plataforma</button>
    </form>

    <div class="demo-info">
      💡 <strong>Acesso Rápido para Testes:</strong><br>
      Pode utilizar qualquer e-mail válido (ex: <code>usuario@edu.com</code>) e senha com 6+ caracteres.
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
