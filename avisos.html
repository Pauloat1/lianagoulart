<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural de Avisos - Portal Goulart Educa</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase SDK e Scripts Globais -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div class="portal-layout">
    <!-- MENU LATERAL (SIDEBAR) -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">Goulart <span>Educa</span></div>
      <nav>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="calendarios.html">📅 Calendário</a>
        <a href="avisos.html" class="active">📢 Mural de Avisos</a>
      </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
      <!-- CABEÇALHO -->
      <header class="header">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <button class="header-toggle-btn" onclick="toggleSidebar()">☰</button>
          <div class="header-title">
            <h2>📢 Mural de Avisos & Comunicados</h2>
          </div>
        </div>

        <div class="user-profile">
          <div class="user-info">
            <p class="name" id="user-display-name">Carregando...</p>
            <p class="role" id="user-display-role">...</p>
          </div>
          <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
      </header>

      <!-- BARRA DE AÇÕES E FILTROS -->
      <div class="card" style="margin-bottom: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          
          <!-- Filtros de Tag e Busca -->
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; flex: 1;">
            <input type="text" id="search-input" class="form-control" placeholder="Buscar aviso por título ou conteúdo..." style="max-width: 320px;" oninput="filtrarAvisos()">
            
            <select id="filter-tag" class="form-control" style="max-width: 180px;" onchange="filtrarAvisos()">
              <option value="todos">Todas as Tags</option>
              <option value="Urgente">🚨 Urgente</option>
              <option value="Geral">📌 Geral</option>
              <option value="Acadêmico">📚 Acadêmico</option>
              <option value="Evento">🎉 Evento</option>
            </select>
          </div>

          <!-- Botão de Novo Aviso (Exibido para Professor e Coordenação) -->
          <button id="btn-novo-aviso" class="btn btn-primary" style="display: none;" onclick="abrirModalAviso()">
            ➕ Novo Aviso
          </button>
        </div>
      </div>

      <!-- LISTA DE CARDS DE AVISOS -->
      <div id="lista-avisos-container" class="grid-1">
        <div class="card" style="text-align: center; color: var(--text-muted); padding: 2rem;">
          Carregando avisos do sistema...
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL DE CRIAÇÃO / EDIÇÃO DE AVISO -->
  <div id="modal-aviso" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 200; justify-content: center; align-items: center; padding: 1rem;">
    <div class="card" style="width: 100%; max-width: 550px; background: #fff; max-height: 90vh; overflow-y: auto;">
      <div class="card-header">
        <h3 class="card-title" id="modal-title">Novo Comunicado</h3>
        <button onclick="fecharModalAviso()" style="background: none; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-muted);">&times;</button>
      </div>

      <form id="form-aviso" onsubmit="salvarAviso(event)">
        <input type="hidden" id="aviso-id">

        <div class="form-group">
          <label for="aviso-titulo">Título do Aviso *</label>
          <input type="text" id="aviso-titulo" class="form-control" placeholder="Ex: Alteração na data da prova" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="aviso-tag">Tag / Categoria *</label>
            <select id="aviso-tag" class="form-control" required>
              <option value="Geral">📌 Geral</option>
              <option value="Urgente">🚨 Urgente</option>
              <option value="Acadêmico">📚 Acadêmico</option>
              <option value="Evento">🎉 Evento</option>
            </select>
          </div>

          <div class="form-group">
            <label for="aviso-publico">Público-Alvo *</label>
            <select id="aviso-publico" class="form-control" required>
              <option value="todos">Todos (Alunos e Profs)</option>
              <option value="alunos">Apenas Alunos</option>
              <option value="professores">Apenas Professores</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="aviso-conteudo">Conteúdo da Mensagem *</label>
          <textarea id="aviso-conteudo" class="form-control" rows="5" placeholder="Escreva os detalhes do aviso..." required></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem;">
          <button type="button" class="btn" style="background: #e2e8f0; color: var(--text-color);" onclick="fecharModalAviso()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-salvar-aviso">Publicar Aviso</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT DE REGRA DE NEGÓCIO DO MURAL -->
  <script src="js/avisos.js"></script>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }
  </script>
</body>
</html>
