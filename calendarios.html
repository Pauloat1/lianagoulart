<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário Acadêmico - Portal Goulart Educa</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase SDK e Scripts Globais -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div class="portal-layout">
    <!-- MENU LATERAL (SIDEBAR) -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">Goulart <span>Educa</span></div>
      <nav>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="calendarios.html" class="active">📅 Calendário</a>
        <a href="avisos.html">📢 Mural de Avisos</a>
        <a href="boletim.html">📝 Boletim & Notas</a>
      </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
      <!-- CABEÇALHO -->
      <header class="header">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <button class="header-toggle-btn" onclick="toggleSidebar()">☰</button>
          <div class="header-title">
            <h2>📅 Calendário & Cronograma Acadêmico</h2>
          </div>
        </div>

        <div class="user-profile">
          <div class="user-info">
            <p class="name" id="user-display-name">Carregando...</p>
            <p class="role" id="user-display-role">...</p>
          </div>
          <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
      </header>

      <!-- BARRA DE CONTROLE E FILTROS -->
      <div class="card" style="margin-bottom: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          
          <!-- Filtros de Tipo e Mês -->
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; flex: 1;">
            <input type="text" id="search-input" class="form-control" placeholder="Buscar por título ou descrição..." style="max-width: 280px;" oninput="filtrarEventos()">
            
            <select id="filter-tipo" class="form-control" style="max-width: 180px;" onchange="filtrarEventos()">
              <option value="todos">Todos os Tipos</option>
              <option value="atividade">📝 Entregas de Atividades</option>
              <option value="prova">✏️ Provas & Avaliações</option>
              <option value="evento">🎉 Eventos Escolares</option>
            </select>

            <select id="filter-mes" class="form-control" style="max-width: 160px;" onchange="filtrarEventos()">
              <option value="todos">Todos os Meses</option>
              <option value="0">Janeiro</option>
              <option value="1">Fevereiro</option>
              <option value="2">Março</option>
              <option value="3">Abril</option>
              <option value="4">Maio</option>
              <option value="5">Junho</option>
              <option value="6">Julho</option>
              <option value="7">Agosto</option>
              <option value="8">Setembro</option>
              <option value="9">Outubro</option>
              <option value="10">Novembro</option>
              <option value="11">Dezembro</option>
            </select>
          </div>

          <!-- Botão de Agendamento (Professores e Coordenação) -->
          <button id="btn-novo-evento" class="btn btn-primary" style="display: none;" onclick="abrirModalEvento()">
            ➕ Novo Agendamento
          </button>
        </div>
      </div>

      <!-- LISTA DE EVENTOS DO CRONOGRAMA -->
      <div id="lista-eventos-container" class="grid-1">
        <div class="card" style="text-align: center; color: var(--text-muted); padding: 2rem;">
          Carregando calendário acadêmico...
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL DE CRIAÇÃO / EDIÇÃO DE EVENTO -->
  <div id="modal-evento" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 200; justify-content: center; align-items: center; padding: 1rem;">
    <div class="card" style="width: 100%; max-width: 550px; background: #fff; max-height: 90vh; overflow-y: auto;">
      <div class="card-header">
        <h3 class="card-title" id="modal-title">Novo Agendamento</h3>
        <button onclick="fecharModalEvento()" style="background: none; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-muted);">&times;</button>
      </div>

      <form id="form-evento" onsubmit="salvarEvento(event)">
        <input type="hidden" id="evento-id">

        <div class="form-group">
          <label for="evento-titulo">Título *</label>
          <input type="text" id="evento-titulo" class="form-control" placeholder="Ex: Entrega do Trabalho de Física" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="evento-tipo">Tipo de Agendamento *</label>
            <select id="evento-tipo" class="form-control" required>
              <!-- Preenchido dinamicamente de acordo com a regra do perfil -->
            </select>
          </div>

          <div class="form-group">
            <label for="evento-data">Data e Hora *</label>
            <input type="datetime-local" id="evento-data" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label for="evento-turma">Turma / Público *</label>
          <select id="evento-turma" class="form-control" required>
            <option value="Todas">Todas as Turmas</option>
            <option value="Turma 101">Turma 101 - 1º Ano</option>
            <option value="Turma 201">Turma 201 - 2º Ano</option>
            <option value="Turma 301">Turma 301 - 3º Ano</option>
          </select>
        </div>

        <div class="form-group">
          <label for="evento-descricao">Descrição / Detalhes</label>
          <textarea id="evento-descricao" class="form-control" rows="4" placeholder="Adicione instruções, capítulos cobrados ou orientações..."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem;">
          <button type="button" class="btn" style="background: #e2e8f0; color: var(--text-color);" onclick="fecharModalEvento()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-salvar-evento">Agendar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT DE REGRA DE NEGÓCIO DO CALENDÁRIO -->
  <script src="js/calendarios.js"></script>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }
  </script>
</body>
</html>
